<style>

    else if (type === "p" || type === "c" || Array.isArray(type)) {
      const opts = type === "p" ? lk.p.map(x => [x.id, x.name]) : type === "c" ? lk.c.map(x => [x.id, x.name]) : type.map(x => [x, pretty(x)]);
      inp = el("select", null, el("option", { value: "" }, req ? "Select..." : "(none)"), opts.map(([v, l]) => el("option", { value: v }, l)));
    } else inp = el("input", { type: type === "d" ? "date" : "text", inputmode: type === "n" ? "decimal" : type === "i" ? "numeric" : null });
    const cur = row ? row[col] : null;
    if (type === "b") inp.checked = !!cur; else if (cur != null) inp.value = String(cur);
    inputs[col] = inp;
    form.append(el("label", null, el("span", null, label + (req ? " *" : "")), inp));
  });
  const save = el("button", { class: "btn primary", type: "submit" }, "Save");
  form.append(msg, el("div", { class: "act" }, el("button", { class: "btn", type: "button", onclick: closeModal }, "Cancel"), save));
  form.addEventListener("submit", async e => {
    e.preventDefault(); msg.textContent = ""; const out = {};
    for (const [col, label, type, req] of fields) {
      const inp = inputs[col];
      if (type === "b") { out[col] = inp.checked; continue; }
      const v = inp.value.trim();
      if (v === "") { if (req) { msg.textContent = label + " is required."; return; } out[col] = null; continue; }
      if (type === "n" || type === "i") {
        const x = Number(v);
        if (!isFinite(x) || (type === "i" && !Number.isInteger(x))) { msg.textContent = label + " must be a " + (type === "i" ? "whole " : "") + "number."; return; }
        out[col] = x;
      } else out[col] = v;
    }
    save.disabled = true;
    const q = row ? sb.from(t).update(out).eq("id", row.id) : sb.from(t).insert(out);
    const { error } = await q;
    if (error) { msg.textContent = error.message; save.disabled = false; return; }
    closeModal(); go("be_ref", { t });
  });
  modal((row ? "Edit" : "Add") + " - " + REF.find(r => r[0] === t)[1], form);
}
function deleteRow(t, row) {
  const msg = el("div", { class: "msg err" }), del = el("button", { class: "btn primary" }, "Delete");
  del.addEventListener("click", async () => {
    del.disabled = true;
    const { error } = await sb.from(t).delete().eq("id", row.id);
    if (error) { msg.textContent = error.message; del.disabled = false; return; }
    closeModal(); go("be_ref", { t });
  });
  modal("Delete this row?", el("div", null, el("p", null, "This removes the row from " + REF.find(r => r[0] === t)[1] + ". It cannot be undone."), msg,
    el("div", { class: "act" }, el("button", { class: "btn", onclick: closeModal }, "Cancel"), del)));
}
async function pBeRef() {
  const t = route.args.t || "cap";
  const { data, error } = await sb.from(t).select(REF.find(r => r[0] === t)[2]).limit(500);
  if (error) return fail(error);
  const lk = await lookups();
  const fields = FIELDS[t];
  const show = (r, [col, , type]) => {
    const v = r[col];
    if (type === "p") return r.product?.name || "";
    if (type === "c") return r.customer?.name || "";
    if (type === "b") return v ? "Yes" : "No";
    if (Array.isArray(type)) return v == null ? "" : pretty(v);
    return v == null ? "" : String(v);
  };
  const sel = el("select", null, REF.map(([v, l]) => el("option", { value: v, selected: v === t }, l)));
  sel.addEventListener("change", () => go("be_ref", { t: sel.value }));
  const cols = fields.map(f => ({ h: f[1].replace(" (optional)", ""), f: r => show(r, f) }));
  cols.push({ h: "", f: r => el("div", { class: "act" }, el("button", { class: "btn sm", onclick: () => editRow(t, r, lk) }, "Edit"), el("button", { class: "btn sm", onclick: () => deleteRow(t, r) }, "Delete")) });
  const body = listPage({ title: "Reference Data", action: el("button", { class: "btn primary", onclick: () => editRow(t, null, lk) }, "Add row"), cols, rows: data,
    search: r => fields.map(f => show(r, f)).join(" "), searchHint: "Search...", empty: "No rows." });
  body[0].querySelector("h1").after(sel);
  return body;
}

const PAGES = { orders: pOrders, returned: pReturned, drafts: pDrafts, upload: pUpload, order: pOrder, draft: pDraft, be_orders: pBeOrders, be_order: pBeOrder, be_history: pBeHistory, be_ref: pBeRef };
const fail = e => [el("div", { class: "head" }, el("h1", null, "Something went wrong")), el("div", { class: "body" }, el("div", { class: "msg err" }, e.message))];

async function draw() {
  const items = NAV[me.role] || [];
  const parent = { order: "orders", draft: "drafts", upload: "orders", be_order: "be_orders" }[route.page] || route.page;
  $("nav").replaceChildren(...items.map(([k, l, ic]) => el("a", { "aria-current": k === parent ? "page" : null, onclick: () => go(k) }, el("span", { class: "ic" }, ic), el("span", { class: "t" }, l))));
  const panel = $("panel");
  if (!items.length) { panel.replaceChildren(el("div", { class: "head" }, el("h1", null, "No screens for this role yet")), el("div", { class: "body" }, el("div", { class: "note" }, "This role has no screens in this build."))); return; }
  panel.replaceChildren(el("div", { class: "body" }, el("div", { class: "empty" }, "Loading...")));
  try { panel.replaceChildren(...await PAGES[route.page]()); } catch (e) { panel.replaceChildren(...fail(e)); }
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  $("login").hidden = !!session; $("shell").hidden = !session;
  if (!session) return;
  const { data: u, error } = await sb.from("app_user").select("display_name, role").eq("id", session.user.id).maybeSingle();
  me = u ? { ...u } : { display_name: session.user.email, role: null };
  $("un").textContent = me.display_name; $("ur").textContent = ROLE_LABEL[me.role] || "No role assigned";
  $("av").textContent = me.display_name.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  go(NAV[me.role] ? NAV[me.role][0][0] : "none");
}
$("lf").addEventListener("submit", async e => {
  e.preventDefault(); $("lmsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) $("lmsg").textContent = error.message; else { $("pw").value = ""; boot(); }
});
$("out").addEventListener("click", async () => { await sb.auth.signOut(); me = null; boot(); });
boot();
</script>
