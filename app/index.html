<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DOAS</title>
<style>
  /* Look taken from the delivery team's DOAS app (Power Apps): burgundy primary, grey sidebar, white rounded panel, pill statuses. */
  :root { --primary:#8d0053; --primary-d:#74002b; --brand:#97085a; --side:#f5f5f5; --active:#e8e8e8; --panel:#fff; --line:#e3e3e3; --fg:#242424; --muted:#707070; --avatar:#eddce2;
          --ok-bg:#daefe6; --ok:#1c6b45; --err-bg:#fbe7e6; --err:#a1262b; --warn-bg:#fdf0d5; --warn:#8a5a00; --info-bg:#e6eaf2; --info:#3b4a68; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:13px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; background:var(--side); color:var(--fg); }
  #shell { display:flex; min-height:100vh; }
  aside { width:183px; flex:none; background:var(--side); display:flex; flex-direction:column; padding:10px 8px; position:sticky; top:0; height:100vh; }
  .brand { display:flex; gap:10px; align-items:center; padding:2px 4px 12px; }
  .brand .logo { width:26px; height:26px; border-radius:4px; background:var(--brand); color:#fff; font-weight:600; display:grid; place-items:center; }
  .brand b { display:block; font-size:13px; } .brand small { color:var(--muted); font-size:11px; }
  nav a { display:flex; gap:10px; align-items:center; padding:7px 8px; border-radius:4px; color:var(--fg); cursor:pointer; margin-bottom:3px; }
  nav a .ic { width:16px; text-align:center; color:var(--muted); }
  nav a[aria-current="page"] { background:var(--active); }
  .user { margin-top:auto; display:flex; gap:10px; align-items:center; padding:8px 4px; border-top:1px solid var(--line); }
  .avatar { width:26px; height:26px; border-radius:50%; background:var(--avatar); color:var(--brand); display:grid; place-items:center; font-size:11px; font-weight:600; flex:none; }
  .user .nm { font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:115px; } .user small { color:var(--muted); font-size:11px; display:block; }
  .user button { background:none; border:0; color:var(--primary); cursor:pointer; padding:0; font:inherit; font-size:11px; }
  main { flex:1; min-width:0; padding:8px 8px 8px 0; }
  .panel { background:var(--panel); border-radius:8px; border:1px solid var(--line); min-height:calc(100vh - 16px); display:flex; flex-direction:column; }
  .head { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); min-height:52px; }
  .head h1 { font-size:14px; font-weight:600; margin:0; flex:1; }
  .crumb { color:var(--muted); } .crumb a { cursor:pointer; } .crumb b { color:var(--fg); font-weight:400; }
  .body { padding:12px 16px; flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .tools { display:flex; gap:10px; flex-wrap:wrap; }
  input[type=text], input[type=email], input[type=password], select { height:32px; padding:0 10px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--fg); font:inherit; }
  .tools input { flex:1; min-width:200px; }
  .tbl { border:1px solid var(--line); border-radius:6px; overflow:auto; flex:1; display:flex; flex-direction:column; }
  table { border-collapse:collapse; width:100%; }
  th { text-align:left; font-weight:400; color:var(--muted); font-size:11px; padding:10px 14px; white-space:nowrap; border-bottom:1px solid var(--line); }
  td { padding:11px 14px; border-bottom:1px solid #f1f1f1; white-space:nowrap; }
  td.id { font-weight:600; } td.num, th.num { text-align:right; } td.dim { color:var(--muted); } td.wrap { white-space:normal; min-width:260px; }
  tr.click { cursor:pointer; } tr.click:hover td { background:#fafafa; }
  .empty { color:var(--muted); text-align:center; padding:22px 0; }
  .foot { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; color:var(--muted); font-size:12px; margin-top:auto; }
  .btn { height:30px; padding:0 14px; border-radius:4px; border:1px solid #c8c8c8; background:#fff; color:var(--fg); cursor:pointer; font:inherit; font-weight:600; font-size:12px; }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:#fff; } .btn.primary:hover { background:var(--primary-d); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.sm { height:26px; padding:0 12px; }
  .pill { display:inline-block; padding:2px 11px; border-radius:99px; font-size:11px; font-weight:600; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); } .pill.err { background:var(--err-bg); color:var(--err); } .pill.warn { background:var(--warn-bg); color:var(--warn); } .pill.info { background:var(--info-bg); color:var(--info); }
  .act { display:flex; gap:8px; justify-content:flex-end; }
  .msg { font-size:12px; min-height:16px; } .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  h2.sec { font-size:12px; font-weight:600; margin:6px 0 0; }
  .drop { border:1px dashed #cfcfcf; border-radius:14px; background:#fafafa; max-width:700px; width:100%; margin:8px auto; padding:36px 24px; text-align:center; }
  .drop .ico { font-size:26px; color:#a77f97; } .drop h3 { margin:8px 0 2px; font-size:13px; } .drop p { margin:0 0 18px; color:var(--muted); font-size:11px; }
  .note { background:#fafafa; border:1px solid var(--line); border-radius:6px; padding:10px 12px; color:var(--muted); font-size:12px; text-align:left; }
  .login { max-width:360px; margin:12vh auto; background:#fff; border:1px solid var(--line); border-radius:8px; padding:24px; }
  .login label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; } .login input { width:100%; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:grid; place-items:center; z-index:20; padding:16px; }
  .dlg { background:#fff; border-radius:8px; padding:20px; width:100%; max-width:460px; max-height:90vh; overflow:auto; }
  .dlg h2 { font-size:14px; margin:0 0 12px; }
  .frm { display:flex; flex-direction:column; gap:10px; }
  .frm label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .frm input[type=text], .frm input[type=date], .frm select { width:100%; color:var(--fg); }
  .frm input[type=checkbox] { width:16px; height:16px; align-self:flex-start; }
  textarea { width:100%; min-height:60px; padding:6px 10px; border:1px solid var(--line); border-radius:4px; font:inherit; color:var(--fg); resize:vertical; }
  .frm .item { border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fafafa; }
  .frm .item b { color:var(--fg); font-weight:600; }
  .twocol { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width: 900px) { .twocol { grid-template-columns:1fr; } }
  .cmt { border:1px solid var(--line); border-radius:6px; padding:8px 12px; } .cmt small { color:var(--muted); display:block; margin-bottom:2px; }
  td.wrap { white-space:normal; min-width:220px; }
  [hidden] { display:none !important; }
  input[hidden], select[hidden] { display:none !important; }
  .tbl td select, .tbl td input[type=text] { font-size:12px; }
  .stack { display:flex; flex-direction:column; gap:4px; }
  @media (max-width: 760px) { aside { width:64px; } .brand div, nav a span.t, .user div { display:none; } .tbl { overflow:auto; } }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="brand"><div class="logo">D</div><div><b>DOAS</b><small>AstraZeneca Egypt</small></div></div>
  <form id="lf">
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <p class="msg err" id="lmsg"></p>
    <button class="btn primary" type="submit" style="width:100%;height:34px">Sign in</button>
  </form>
</div>

<div id="shell" hidden>
  <aside>
    <div class="brand"><div class="logo">D</div><div><b>DOAS</b><small>AstraZeneca Egypt</small></div></div>
    <nav id="nav"></nav>
    <div class="user"><div class="avatar" id="av"></div><div><div class="nm" id="un"></div><small id="ur"></small><button id="out">Sign out</button></div></div>
  </aside>
  <main><div class="panel" id="panel"></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = window.supabase.createClient("https://uyamkictdpdvuejftglw.supabase.co", "sb_publishable_1DScXyeTpxGvv59KzhK3Gw_OR--45YD");
const $ = id => document.getElementById(id);
const ROLE_LABEL = { distribution_manager: "Distribution Manager", back_end_monitoring: "Back-End Monitoring", second_line_manager: "Second Line Manager", business_unit_director: "Business Unit Director", cfo: "CFO", cp: "CP", management: "Management" };
const APPROVER_NAV = [["ap_list", "My approvals", "✓"], ["notes", "Notifications", "●"]];
const NAV = {
  distribution_manager: [["orders", "My Orders", "≡"], ["returned", "Returned Orders", "↺"], ["drafts", "Drafts", "✎"], ["notes", "Notifications", "●"]],
  back_end_monitoring: [["be_orders", "Orders", "≡"], ["be_history", "Order History", "↺"], ["be_ref", "Reference Data", "▤"], ["notes", "Notifications", "●"]],
  second_line_manager: APPROVER_NAV, business_unit_director: APPROVER_NAV, cfo: APPROVER_NAV, cp: APPROVER_NAV
};
let me = null, route = { page: null, args: {} };

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const k in (props || {})) { const v = props[k]; if (v == null || v === false) continue; if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v); }
  for (const c of kids.flat(Infinity)) n.append(c instanceof Node ? c : document.createTextNode(c == null ? "" : String(c)));
  return n;
}
const dt = s => s ? new Date(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "";
const dtt = s => s ? new Date(s).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
/* Time since a line was returned, in calendar days. No working-day count and no escalation colour: that rule is still open (G0-10). */
const waited = s => { const d = Math.floor((Date.now() - new Date(s).getTime()) / 86400000); return d <= 0 ? "Today" : d === 1 ? "1 day" : d + " days"; };
const num = v => v == null ? "" : Number(v).toLocaleString("en-US", { maximumFractionDigits: 2 });
const pill = (text, kind) => el("span", { class: "pill " + kind }, text);
const checkPill = r => r ? pill(r, r === "Valid" ? "ok" : "err") : "";
const sevPill = s => pill(s === "error" ? "Error" : s === "warning" ? "Warning" : "Information", s === "error" ? "err" : s === "warning" ? "warn" : "info");

function go(page, args) { route = { page, args: args || {} }; draw(); }

/* ---------- generic list page: title, optional action, search, table, paging ---------- */
function listPage({ title, action, cols, rows, search, searchHint, onRow, empty }) {
  const PAGE = 10; let page = 0, q = "";
  const tbody = el("tbody"), pageLbl = el("span"), prev = el("button", { class: "btn sm", disabled: true }, "‹ Previous"), next = el("button", { class: "btn sm" }, "Next ›");
  function paint() {
    const f = q ? rows.filter(r => search(r).toLowerCase().includes(q)) : rows;
    const last = Math.max(0, Math.ceil(f.length / PAGE) - 1); if (page > last) page = last;
    tbody.replaceChildren(...(f.length ? f.slice(page * PAGE, page * PAGE + PAGE).map(r => {
      const tr = el("tr", { class: onRow ? "click" : "" }, cols.map(c => el("td", { class: [c.cls, c.num ? "num" : ""].join(" ") }, c.f(r))));
      if (onRow) tr.addEventListener("click", () => onRow(r)); return tr; }) : [el("tr", null, el("td", { colspan: cols.length, class: "empty" }, empty))]));
    pageLbl.textContent = "Page " + (page + 1); prev.disabled = page === 0; next.disabled = page >= last;
  }
  prev.addEventListener("click", () => { page--; paint(); }); next.addEventListener("click", () => { page++; paint(); });
  const box = el("input", { type: "text", placeholder: searchHint });
  box.addEventListener("input", () => { q = box.value.trim().toLowerCase(); page = 0; paint(); });
  paint();
  return [
    el("div", { class: "head" }, el("h1", null, title), action || ""),
    el("div", { class: "body" }, el("div", { class: "tools" }, box), el("div", { class: "msg", id: "msg" }),
      el("div", { class: "tbl" }, el("table", null, el("thead", null, el("tr", null, cols.map(c => el("th", { class: c.num ? "num" : "" }, c.h)))), tbody), el("div", { class: "foot" }, pageLbl, el("div", { class: "act" }, prev, next))))
  ];
}
const say = (t, k) => { const m = $("msg"); if (m) { m.textContent = t || ""; m.className = "msg " + (k || ""); } };
const crumbs = (...parts) => el("h1", { class: "crumb" }, parts.map((p, i) => [i ? " / " : "", p.go ? el("a", { onclick: () => go(p.go) }, p.t) : el("b", null, p.t)]));

/* ---------- Distribution Manager ---------- */
async function pOrders() {
  const { data, error } = await sb.from("my_orders").select("*").order("arrived_at", { ascending: false });
  if (error) return fail(error);
  return listPage({ title: "My orders", action: el("button", { class: "btn primary", onclick: () => go("upload") }, "Upload order"),
    cols: [{ h: "Order", f: r => r.order_no, cls: "id" }, { h: "Customer", f: r => r.customer }, { h: "Distributor", f: r => r.distributor }, { h: "Products", f: r => r.products, num: true }, { h: "Arrived", f: r => dt(r.arrived_at), cls: "dim" }],
    rows: data, search: r => [r.order_no, r.customer, r.distributor, r.file_name].join(" "), searchHint: "Search by order, customer or code...",
    onRow: r => go("order", { id: r.order_id, no: r.order_no, back: "orders" }), empty: "No orders found." });
}
/* Returned lines only: the rest of the order keeps moving through the cycle. The Distribution Manager edits the returned lines, then resubmits the order. */
async function pReturned() {
  const { data, error } = await sb.from("line_return").select("id, returned_by_name, returned_by_role, returned_at, reason, resolved_at, line:order_line(" + LINE_COLS + ", order_id, order:orders(order_no))").order("returned_at", { ascending: false });
  if (error) return fail(error);
  const orders = new Map();
  data.forEach(r => { const l = r.line; if (!l) return; if (!orders.has(l.order_id)) orders.set(l.order_id, { id: l.order_id, no: l.order?.order_no, rows: [] }); orders.get(l.order_id).rows.push(r); });
  const list = [...orders.values()].sort((a, b) => b.no - a.no);
  const head = el("div", { class: "head" }, el("h1", null, "Returned Orders"), el("button", { class: "btn primary", onclick: () => go("upload") }, "Upload order"));
  if (!list.length) return [head, el("div", { class: "body" }, el("div", { class: "empty" }, "No returned orders."))];
  const sections = list.map(o => {
    const open = o.rows.filter(r => !r.resolved_at);
    const msg = el("div", { class: "msg" }), box = el("div");
    const tbl = linesTable(o.rows.map(r => ({ ...mapLine(r.line), ret: r })), [
      { h: "Returned by", f: l => l.ret.returned_by_name + " (" + (ROLE_LABEL[l.ret.returned_by_role] || l.ret.returned_by_role) + ")" },
      { h: "Returned", f: l => dt(l.ret.returned_at), cls: "dim" },
      { h: "Waiting", f: l => l.ret.resolved_at ? "" : waited(l.ret.returned_at) },
      { h: "Comment", f: l => l.ret.reason, cls: "wrap" },
      { h: "Status", f: l => l.ret.resolved_at ? pill("Corrected", "ok") : pill("Waiting for you", "warn") },
      { h: "", f: l => l.ret.resolved_at ? "" : el("button", { class: "btn sm", onclick: () => editLine(l, () => go("returned")) }, "Edit") }]);
    const resub = el("button", { class: "btn primary", disabled: !open.length }, "Resubmit order");
    resub.addEventListener("click", async () => {
      resub.disabled = true; msg.textContent = ""; box.replaceChildren();
      const { data: res, error: e } = await sb.rpc("dm_resubmit_returned", { p_order_id: o.id });
      if (e) { msg.textContent = e.message; msg.className = "msg err"; resub.disabled = false; return; }
      if (res === "Valid") { go("returned"); return; }
      msg.textContent = "The order has check errors. Correct the lines and resubmit."; msg.className = "msg err"; resub.disabled = false;
      const ids = o.rows.map(r => r.line.id), ord = (await sb.from("orders").select("file_id").eq("id", o.id).single()).data;
      const issues = await loadIssues(o.id, ord.file_id, ids), rowOf = Object.fromEntries(o.rows.map(r => [r.line.id, r.line.file_row]));
      box.replaceChildren(issueTable(issues, i => i.line_id ? rowOf[i.line_id] : "File"));
    });
    return el("div", { style: "display:flex;flex-direction:column;gap:8px" }, el("h2", { class: "sec" }, "Order " + o.no + (open.length ? "  -  " + open.length + " line(s) waiting for you" : "")), tbl,
      el("div", { class: "act", style: "justify-content:space-between;align-items:center" }, msg, resub), box);
  });
  return [head, el("div", { class: "body" }, el("div", { class: "note" }, "Only the returned lines are waiting for you. The rest of the order continues in the approval cycle. Edit a returned line, then resubmit the order."), sections)];
}
async function pDrafts() {
  const { data, error } = await sb.from("my_drafts").select("*").order("date_saved", { ascending: false });
  if (error) return fail(error);
  const nos = await orderNos(data.map(d => d.order_id));
  data.forEach(d => d.no = nos[d.order_id]);
  return listPage({ title: "Drafts", action: el("button", { class: "btn primary", onclick: () => go("upload") }, "Upload order"),
    cols: [{ h: "Order", f: r => r.no, cls: "id" }, { h: "File", f: r => r.file_name }, { h: "Saved", f: r => dt(r.date_saved), cls: "dim" }, { h: "Status", f: r => checkPill(r.status) },
           { h: "", f: r => el("div", { class: "act" }, el("button", { class: "btn primary sm", onclick: e => { e.stopPropagation(); go("draft", { id: r.order_id, no: r.no }); } }, "View")) }],

  return Object.fromEntries((data || []).map(o => [o.id, o.order_no]));
}

    el("div", { class: "act" }, el("button", { class: "btn", onclick: closeModal }, "Cancel"), del)));
}
async function pBeRef() {
  const t = route.args.t || "cap";
  const { data, error } = await sb.from(t).select(REF.find(r => r[0] === t)[2]).limit(500);
  if (error) return fail(error);
  const lk = await lookups();
  const fields = FIELDS[t];
  const show = (r, [col, , type]) => {
    const v = r[col];
    if (type === "p") return r.product?.name || "";
    if (type === "c") return r.customer?.name || "";
    if (type === "b") return v ? "Yes" : "No";
    if (Array.isArray(type)) return v == null ? "" : pretty(v);
    return v == null ? "" : String(v);
  };
  const sel = el("select", null, REF.map(([v, l]) => el("option", { value: v, selected: v === t }, l)));
  sel.addEventListener("change", () => go("be_ref", { t: sel.value }));
  const cols = fields.map(f => ({ h: f[1].replace(" (optional)", ""), f: r => show(r, f) }));
  cols.push({ h: "", f: r => el("div", { class: "act" }, el("button", { class: "btn sm", onclick: () => editRow(t, r, lk) }, "Edit"), el("button", { class: "btn sm", onclick: () => deleteRow(t, r) }, "Delete")) });
  const body = listPage({ title: "Reference Data", action: el("button", { class: "btn primary", onclick: () => editRow(t, null, lk) }, "Add row"), cols, rows: data,
    search: r => fields.map(f => show(r, f)).join(" "), searchHint: "Search...", empty: "No rows." });
  body[0].querySelector("h1").after(sel);
  return body;
}


/* ---------- Approvers: Second Line Manager, Business Unit Director, CFO, CP ---------- */
async function pApList() {
  const [o, q, ag] = await Promise.all([sb.from("orders").select("id, order_no, arrived_at, route_state, file:order_file(uploaded_name), lines:order_line(id)").order("arrived_at", { ascending: false }), sb.rpc("ap_actionable_lines"), sb.from("order_ageing").select("*")]);
  if (o.error) return fail(o.error); if (q.error) return fail(q.error);
  const mine = {}; (q.data || []).forEach(r => { mine[r.order_id] = (mine[r.order_id] || 0) + 1; });
  const age = Object.fromEntries((ag.data || []).map(a => [a.order_id, a]));
  const rows = o.data.map(r => ({ ...r, mine: mine[r.id] || 0, age: age[r.id] })).sort((a, b) => (b.mine > 0) - (a.mine > 0));
  return listPage({ title: "My approvals", cols: [{ h: "Order", f: r => r.order_no, cls: "id" }, { h: "File", f: r => r.file?.uploaded_name || "" }, { h: "Products", f: r => r.lines.length, num: true },
      { h: "Status", f: r => r.mine ? pill(r.mine + " product(s) waiting for you", "warn") : statePill(r.route_state) }, { h: "Ageing", f: r => ageing(r.age) }, { h: "Arrived", f: r => dt(r.arrived_at), cls: "dim" }],
    rows, search: r => [r.order_no, r.file?.uploaded_name].join(" "), searchHint: "Search by order or file...", onRow: r => go("ap_order", { id: r.id, no: r.order_no }), empty: "No orders are waiting for you." });
}
async function pApOrder() {
  const { id, no } = route.args, reload = () => go("ap_order", route.args);
  const { data: raw, error } = await sb.from("order_line").select(LINE_COLS_X).eq("order_id", id).order("file_row");
  if (error) return fail(error);
  if (!raw.length) return fail({ message: "Order not found." });
  const lines = raw.map(mapLine), ids = raw.map(r => r.id);
  const [oR, dcR, cmR, qR, agR, rtR, names] = await Promise.all([sb.from("orders").select("route_state, concern_type, concern_note, arrived_at, file:order_file(uploaded_name)").eq("id", id).single(),
    sb.from("line_decision").select("*").in("line_id", ids).eq("superseded", false).order("decided_at"), sb.from("order_comment").select("*").eq("order_id", id).order("created_at", { ascending: false }),
    sb.rpc("ap_actionable_lines", { p_order_id: id }), sb.from("order_ageing").select("*").eq("order_id", id).maybeSingle(),
    sb.from("line_return").select("line_id, reason, returned_by_name, resolved_at").in("line_id", ids).is("resolved_at", null), userNames()]);
  if (oR.error) return fail(oR.error);
  const o = oR.data, decs = dcR.data || [], comments = cmR.data || [], act = new Map((qR.data || []).map(r => [r.line_id, r.stage])), openRet = new Set((rtR.data || []).map(r => r.line_id));
  const decided = new Set(decs.filter(d => d.decision === "approved").map(d => d.line_id + ":" + d.stage));
  const ctl = {};
  const progress = l => {
    const r = l.raw, nxt = nextStageOf(r, decided), bits = (r.required_stages || []).map(x => {
      const d = decs.find(y => y.line_id === l.id && y.stage === x && y.decision === "approved");
      return d ? pill(ROLE_SHORT[x] + " approved " + num(d.quantity), "ok") : pill(ROLE_SHORT[x], r.status === "In approval" && x === nxt ? "warn" : "info"); });
    const rej = decs.find(y => y.line_id === l.id && y.decision === "rejected");
    return el("div", { class: "stack" }, el("div", null, bits.length ? bits : "", rej ? pill(ROLE_SHORT[rej.stage] + " rejected", "err") : ""),
      decs.filter(d => d.line_id === l.id && d.rationale).map(d => el("small", { class: "dim" }, ROLE_LABEL[d.stage] + " (" + d.decided_name + "): " + d.rationale)));
  };
  const decisionCell = l => {
    if (!act.has(l.id)) return openRet.has(l.id) ? pill("Returned to Distribution Manager", "warn") : "";
    const sel = el("select", null, el("option", { value: "" }, "No decision yet"), el("option", { value: "approve" }, "Approve"), el("option", { value: "reject" }, "Reject"), el("option", { value: "return" }, "Return to Distribution Manager"));
    const qty = el("input", { type: "text", inputmode: "decimal", style: "width:90px", title: "Approved quantity (0 to the requested quantity)" }), why = el("input", { type: "text", placeholder: "Reason", style: "width:220px" });
    qty.value = l.quantity; ctl[l.id] = { sel, qty, why };
    const sync = () => { qty.hidden = sel.value !== "approve"; why.hidden = !(sel.value === "reject" || sel.value === "return"); }; sel.addEventListener("change", sync); sync();
    return el("div", { class: "stack" }, el("small", { class: "dim" }, "Your stage: " + ROLE_LABEL[act.get(l.id)]), sel, qty, why);
  };
  const rat = el("textarea", { placeholder: "Rationale for your approval" }), submit = el("button", { class: "btn primary" }, "Submit decisions");
  submit.addEventListener("click", async () => {
    const dec = [];
    for (const l of lines) {
      const c = ctl[l.id]; if (!c || !c.sel.value) continue; const d = { line_id: l.id, decision: c.sel.value };
      if (d.decision === "approve") { const q = c.qty.value.trim(); if (q === "" || !isFinite(Number(q)) || Number(q) < 0 || Number(q) > Number(l.quantity)) { say("Row " + l.file_row + ": the approved quantity must be between 0 and " + num(l.quantity) + ".", "err"); return; } d.quantity = Number(q); }
      else { const w = c.why.value.trim(); if (!w) { say("Row " + l.file_row + ": a reason is required.", "err"); return; } d.reason = w; }
      dec.push(d);
    }
    if (!dec.length) { say("Choose a decision for at least one product.", "err"); return; }
    if (dec.some(d => d.decision === "approve" && act.get(d.line_id) === "second_line_manager") && !rat.value.trim()) { say("A rationale is required when the Second Line Manager approves.", "err"); return; }
    submit.disabled = true;
    const { error: e } = await sb.rpc("ap_decide", { p_order_id: id, p_decisions: dec, p_rationale: rat.value.trim() || null });
    if (e) { say(e.message, "err"); submit.disabled = false; return; } reload();
  });
  const cmts = comments.length ? comments.map(c => el("div", { class: "cmt" }, el("small", null, (names[c.author] || "Back-End") + " · " + dtt(c.created_at) + (c.mentioned_name ? " · mentions " + c.mentioned_name : "")), c.body)) : [el("div", { class: "note" }, "No comments.")];
  return [el("div", { class: "head" }, crumbs({ t: "My approvals", go: "ap_list" }, { t: "Order " + (no ?? "") }), statePill(o.route_state), ageing(agR.data), act.size ? submit : ""),
    el("div", { class: "body" }, el("div", { class: "dim" }, [o.file?.uploaded_name || "", " · arrived ", dtt(o.arrived_at)].join("")), el("div", { class: "msg", id: "msg" }),
      o.concern_type ? el("div", { class: "note" }, "Concern: " + o.concern_type + (o.concern_note ? " - " + o.concern_note : "")) : "",
      act.size ? el("div", { class: "note" }, "Decide each product you own at this stage. Approve (quantity from 0 up to the requested quantity), reject with a reason, or return to the Distribution Manager with a reason. Products you leave without a decision stay with you.") : el("div", { class: "note" }, "Nothing is waiting for your decision on this order."),
      el("h2", { class: "sec" }, "Products"),
      linesTable(lines, [{ h: "Your decision", f: decisionCell }, { h: "Approval progress", f: progress }, { h: "Back-End inputs", f: l => inputsOf(l), cls: "wrap" }, { h: "Approved", f: l => outcomeOf(l) }]),
      act.size ? [el("h2", { class: "sec" }, "Rationale"), el("div", { class: "dim" }, "Required when the Second Line Manager approves. Later approvers see it."), rat] : "",
      el("h2", { class: "sec" }, "Comments"), cmts)];
}

/* ---------- Notifications (in the app; e-mail is not built) ---------- */
const openOrder = (oid, no) => me.role === "distribution_manager" ? go("order", { id: oid, no, back: "orders" }) : me.role === "back_end_monitoring" ? go("be_order", { id: oid, no }) : go("ap_order", { id: oid, no });
async function unreadBadge() {
  const { count } = await sb.from("notification").select("id", { count: "exact", head: true }).is("read_at", null);
  const t = document.querySelector('#nav a[data-k="notes"] .t'); if (t) t.textContent = "Notifications" + (count ? " (" + count + ")" : "");
}
async function pNotes() {
  const { data, error } = await sb.from("notification").select("id, order_id, kind, message, created_at, read_at, order:orders(order_no)").order("created_at", { ascending: false }).limit(200);
  if (error) return fail(error);
  sb.rpc("mark_notifications_read").then(() => unreadBadge());
  return listPage({ title: "Notifications", cols: [{ h: "When", f: r => dtt(r.created_at), cls: "dim" }, { h: "", f: r => r.read_at ? "" : pill("New", "info") }, { h: "Message", f: r => r.message, cls: "wrap" }],
    rows: data, search: r => r.message, searchHint: "Search notifications...", onRow: r => r.order_id && openOrder(r.order_id, r.order?.order_no), empty: "No notifications." });
}

const PAGES = { orders: pOrders, returned: pReturned, drafts: pDrafts, upload: pUpload, order: pOrder, draft: pDraft, be_orders: pBeOrders, be_order: pBeOrder, be_history: pBeHistory, be_ref: pBeRef, ap_list: pApList, ap_order: pApOrder, notes: pNotes };
const fail = e => [el("div", { class: "head" }, el("h1", null, "Something went wrong")), el("div", { class: "body" }, el("div", { class: "msg err" }, e.message))];

async function draw() {
  const items = NAV[me.role] || [];
  const parent = { order: "orders", draft: "drafts", upload: "orders", be_order: "be_orders", ap_order: "ap_list" }[route.page] || route.page;
  $("nav").replaceChildren(...items.map(([k, l, ic]) => el("a", { "data-k": k, "aria-current": k === parent ? "page" : null, onclick: () => go(k) }, el("span", { class: "ic" }, ic), el("span", { class: "t" }, l))));
  if (items.some(x => x[0] === "notes")) unreadBadge();
  const panel = $("panel");
  if (!items.length) { panel.replaceChildren(el("div", { class: "head" }, el("h1", null, "No screens for this role yet")), el("div", { class: "body" }, el("div", { class: "note" }, "This role has no screens in this build."))); return; }
  panel.replaceChildren(el("div", { class: "body" }, el("div", { class: "empty" }, "Loading...")));
  try { panel.replaceChildren(...await PAGES[route.page]()); } catch (e) { panel.replaceChildren(...fail(e)); }
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  $("login").hidden = !!session; $("shell").hidden = !session;
  if (!session) return;
  const { data: u, error } = await sb.from("app_user").select("display_name, role").eq("id", session.user.id).maybeSingle();
  me = u ? { ...u } : { display_name: session.user.email, role: null };
  $("un").textContent = me.display_name; $("ur").textContent = ROLE_LABEL[me.role] || "No role assigned";
  $("av").textContent = me.display_name.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  go(NAV[me.role] ? NAV[me.role][0][0] : "none");
}
$("lf").addEventListener("submit", async e => {
  e.preventDefault(); $("lmsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) $("lmsg").textContent = error.message; else { $("pw").value = ""; boot(); }
});
$("out").addEventListener("click", async () => { await sb.auth.signOut(); me = null; boot(); });
boot();
</script>
