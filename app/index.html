async function pBeHistory() {
  const { data, error } = await sb.from("action_log").select("*, order:orders(order_no)").order("at", { ascending: false }).limit(200);
  if (error) return fail(error);
  return listPage({ title: "Order History", cols: [{ h: "When", f: r => dtt(r.at), cls: "dim" }, { h: "Order", f: r => r.order?.order_no ?? "", cls: "id" }, { h: "Action", f: r => r.action }, { h: "Role", f: r => ROLE_LABEL[r.actor_role] || r.actor_role }, { h: "Detail", f: r => r.detail || "" }],
    rows: data, search: r => [r.order?.order_no, r.action, r.detail].join(" "), searchHint: "Search by order, action or detail...", empty: "No actions recorded yet." });
}
const REF = [["cap", "Caps", "*, product(name)"], ["product_growth", "Allowed growth", "*, product(name)"], ["guided_value", "Guided Value", "*"], ["product_map", "Product map", "*, product(name)"], ["approver", "Approvers", "*"],
  ["special_case", "Special-case accounts", "*, customer(name)"], ["blacklist", "Blacklist", "*, customer(name)"], ["bulk_purchase", "Bulk-purchase list", "*, customer(name), product(name)"], ["concern_type", "Concern types", "*"],
  ["holiday", "Holidays", "*"], ["stock_sales_out", "Stock and sales-out", "*, customer(name), product(name)"], ["customer", "Customers", "*"], ["product", "Products", "*"]];
async function pBeRef() {
  const t = route.args.t || "cap";
  const { data, error } = await sb.from(t).select(REF.find(r => r[0] === t)[2]).limit(500);
  if (error) return fail(error);
  const keys = data.length ? Object.keys(data[0]).filter(k => !["id", "created_at", "demo"].includes(k) && !k.endsWith("_id")) : [];
  data.forEach(r => keys.forEach(k => { if (r[k] && typeof r[k] === "object") r[k] = r[k].name; }));
  const sel = el("select", null, REF.map(([v, l]) => el("option", { value: v, selected: v === t }, l)));
  sel.addEventListener("change", () => go("be_ref", { t: sel.value }));
  const body = listPage({ title: "Reference Data", cols: keys.map(k => ({ h: k.replace(/_/g, " "), f: r => r[k] == null ? "" : String(r[k]) })), rows: data, search: r => Object.values(r).join(" "), searchHint: "Search...", empty: "No rows." });
  body[0].querySelector("h1").after(sel); body[1].insertBefore(el("div", { class: "note" }, "Read-only for now. Editing these tables (FR-42) is not built yet."), body[1].firstChild);
  return body;
}

const PAGES = { orders: pOrders, returned: pReturned, drafts: pDrafts, upload: pUpload, order: pOrder, draft: pDraft, be_orders: pBeOrders, be_order: pBeOrder, be_history: pBeHistory, be_ref: pBeRef };
const fail = e => [el("div", { class: "head" }, el("h1", null, "Something went wrong")), el("div", { class: "body" }, el("div", { class: "msg err" }, e.message))];

async function draw() {
  const items = NAV[me.role] || [];
  const parent = { order: "orders", draft: "drafts", upload: "orders", be_order: "be_orders" }[route.page] || route.page;
  $("nav").replaceChildren(...items.map(([k, l, ic]) => el("a", { "aria-current": k === parent ? "page" : null, onclick: () => go(k) }, el("span", { class: "ic" }, ic), el("span", { class: "t" }, l))));
  const panel = $("panel");
  if (!items.length) { panel.replaceChildren(el("div", { class: "head" }, el("h1", null, "No screens for this role yet")), el("div", { class: "body" }, el("div", { class: "note" }, "This role has no screens in this build."))); return; }
  panel.replaceChildren(el("div", { class: "body" }, el("div", { class: "empty" }, "Loading...")));
  try { panel.replaceChildren(...await PAGES[route.page]()); } catch (e) { panel.replaceChildren(...fail(e)); }
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  $("login").hidden = !!session; $("shell").hidden = !session;
  if (!session) return;
  const { data: u, error } = await sb.from("app_user").select("display_name, role").eq("id", session.user.id).maybeSingle();
  me = u ? { ...u } : { display_name: session.user.email, role: null };
  $("un").textContent = me.display_name; $("ur").textContent = ROLE_LABEL[me.role] || "No role assigned";
  $("av").textContent = me.display_name.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  go(NAV[me.role] ? NAV[me.role][0][0] : "none");
}
$("lf").addEventListener("submit", async e => {
  e.preventDefault(); $("lmsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) $("lmsg").textContent = error.message; else { $("pw").value = ""; boot(); }
});
$("out").addEventListener("click", async () => { await sb.auth.signOut(); me = null; boot(); });
boot();
</script>
</body>
</html>
